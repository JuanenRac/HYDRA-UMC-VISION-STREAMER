[project]
name = "hydra-umc-vision-streamer"
version = "0.0.6"
description = "Optimized GStreamer capture and pre-processing pipeline for up to 8x USB 3.0 camera streams feeding the Hailo-8 NPU on HYDRA-UMC-VISION-NODE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "JuanenRac", email = "electrohobby3d@gmail.com" }]
# No runtime dependencies yet - the v0 config/pipeline-description layer
# (config.py, pipeline.py, mediamtx_config.py) uses only the stdlib; its
# MediaMTX YAML output is hand-rolled rather than pulling in PyYAML for a
# shape this simple (see mediamtx_config.py). Still planned once the
# runtime lands: PyGObject (GStreamer bindings), v4l2py (camera control).
dependencies = []

# hailo_runtime.py's own hailort import is lazy (see that module's own
# header) so this extra is only needed to actually run inference against
# a real Hailo-8 module - never to import or test this package.
[project.optional-dependencies]
dev = ["pytest>=8.0"]
hailo = ["hailort"]

[project.scripts]
hydra-umc-vision-streamer = "hydra_umc_vision_streamer.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
