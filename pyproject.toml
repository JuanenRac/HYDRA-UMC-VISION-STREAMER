[project]
name = "hydra-umc-vision-streamer"
version = "0.0.2"
description = "Optimized GStreamer capture and pre-processing pipeline for up to 8x USB 3.0 camera streams feeding the Hailo-8 NPU on HYDRA-UMC-VISION-NODE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "JuanenRac", email = "electrohobby3d@gmail.com" }]
# No runtime dependencies yet - this is the skeleton stage (see
# SONNET/HYDRA-UMC-VISION-STREAMER/mejoras_futuras.txt). Planned once real
# business logic lands: PyGObject (GStreamer bindings), v4l2py (camera
# control), pyyaml (per-camera exposure/gain configuration).
dependencies = []

[project.scripts]
hydra-umc-vision-streamer = "hydra_umc_vision_streamer.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
